# ClearPath Reverse Proxy — nginx configuration
#
# Usage:
#   nginx -t -c /path/to/this/nginx.conf
#   nginx -s reload
#
# This serves:
#   /           → index.html (landing page)
#   /api/*      → NestJS backend  (localhost:4000)
#   /*          → Next.js frontend (localhost:3000)
#
# Place this file at /etc/nginx/sites-available/clearpath (Linux)
# or include it from your nginx config directory.
#
# IMPORTANT: Update the `root` path below to match your project directory!

upstream clearpath-backend {
  server localhost:4000;
}

upstream clearpath-frontend {
  server localhost:3000;
}

server {
  listen 8080;
  server_name localhost;

  # ── Security headers ──
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ── Gzip compression ──
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml text/javascript image/svg+xml;
  gzip_min_length 256;

  # ── Root directory ──
  # ⚠ Update this to the absolute path of your project root!
  root /var/www/clearpath;
  index index.html;

  # ── Landing page ──
  location = / {
    try_files /index.html =404;
  }

  # ── Backend API ──
  location /api/ {
    proxy_pass http://clearpath-backend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_read_timeout    90s;
    proxy_connect_timeout 90s;
    proxy_send_timeout    90s;
  }

  # ── Health check ──
  location /health {
    proxy_pass http://clearpath-backend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Frontend (Next.js) — catch all other paths ──
  location / {
    proxy_pass http://clearpath-frontend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_read_timeout    90s;
    proxy_connect_timeout 90s;
    proxy_send_timeout    90s;

    # Disable buffering for Server-Sent Events (Next.js dev mode)
    proxy_buffering off;
  }
}
