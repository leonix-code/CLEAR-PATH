services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: clearpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearpath
      POSTGRES_PASSWORD: clearpath_secret_2024
      POSTGRES_DB: clearpath_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clearpath']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: clearpath-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass clearpath_redis_2024
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (NestJS) ──
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: clearpath-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://clearpath:clearpath_secret_2024@postgres:5432/clearpath_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: clearpath_redis_2024
      JWT_SECRET: changeme_jwt_secret_in_production_2024
      JWT_REFRESH_SECRET: changeme_jwt_refresh_secret_in_production_2024
      JWT_EXPIRES_IN: 15m
      API_PREFIX: api/v1
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/health', '||', 'exit', '1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: clearpath-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health', '||', 'exit', '1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - backend

  # ── Caddy reverse proxy ──
  caddy:
    build:
      context: ..
      dockerfile: docker/caddy/Dockerfile
    container_name: clearpath-caddy
    restart: unless-stopped
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/health', '||', 'exit', '1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
