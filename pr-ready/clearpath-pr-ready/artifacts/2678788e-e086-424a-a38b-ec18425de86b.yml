# Secrets come from ../.env (NOT committed) or your platform secret store.
services:
  postgres:
    image: postgres:16-alpine
    container_name: clearpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: clearpath-redis
    restart: unless-stopped
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: { context: .., dockerfile: docker/backend/Dockerfile }
    container_name: clearpath-backend
    restart: unless-stopped
    ports: ['4000:4000']
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: 4000
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/health']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build: { context: .., dockerfile: docker/frontend/Dockerfile }
    container_name: clearpath-frontend
    restart: unless-stopped
    ports: ['3000:3000']
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on: [backend]
  caddy:
    build: { context: .., dockerfile: docker/caddy/Dockerfile }
    container_name: clearpath-caddy
    restart: unless-stopped
    ports: ['8080:8080']
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
